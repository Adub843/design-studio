<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--raise:#ece5d6;--line:#ddd3bf;--fg:#16203a;--muted:#5e6474;--accent:#0e7c74;--accent-fg:#fff;--stage:#e7e1d4;--warn:#9a5b00;--ok:#0e7c74;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1428;--card:#111d36;--raise:#182644;--line:#24345a;--fg:#f3ede1;--muted:#aab3c7;--accent:#4fc8bd;--accent-fg:#06201d;--stage:#0d1830;--warn:#f0b44c;--ok:#4fc8bd;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1428;--card:#111d36;--raise:#182644;--line:#24345a;--fg:#f3ede1;--muted:#aab3c7;--accent:#4fc8bd;--accent-fg:#06201d;--stage:#0d1830;--warn:#f0b44c;--ok:#4fc8bd;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
[hidden]{display:none!important}.small{font-size:12.5px}.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--muted)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}.btn.sm{padding:6px 10px;font-size:13px}.btn.ghost{background:none;border-color:transparent}.btn.ghost:hover{background:var(--raise)}
.btn.icon{padding:7px}
#lbMount{flex:1;min-height:0;display:flex}
.ed{flex:1;min-width:0;min-height:0;display:grid;grid-template-columns:76px 292px minmax(0,1fr) 304px;grid-template-rows:56px minmax(0,1fr)}
.ed-top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);min-width:0}
.ed-brand{font-weight:600;font-size:15px;white-space:nowrap}.ed-brand span{color:var(--muted);font-weight:500}
.seg{display:inline-flex;background:var(--raise);border-radius:9px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.seg button{font:inherit;font-size:13.5px;font-weight:500;border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ed-top .grow{flex:1}
.ed-rail{grid-row:2;grid-column:1;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:8px 6px;overflow:auto}
.ed-rail button{font:inherit;font-size:11.5px;font-weight:500;border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:4px;padding:9px 2px;border-radius:9px;cursor:pointer}
.ed-rail button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ed-rail button:hover{color:var(--fg)}.ed-rail button[aria-pressed="true"]{background:var(--raise);color:var(--accent)}
.ed-rail .r-print{display:none}
.ed-drawer{grid-row:2;grid-column:2;background:var(--card);border-right:1px solid var(--line);overflow:auto;padding:18px 16px 24px}
.ed-props{grid-row:2;grid-column:4;background:var(--card);border-left:1px solid var(--line);overflow:auto;padding:18px 16px 24px}
.ed-drawer h2,.ed-props h2{font-size:15px;margin:0 0 14px;font-weight:600}
.ed-props h3,.ed-drawer h3{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px;font-weight:600}
.sheet-x{display:none}
.fld{display:block;font-size:12.5px;color:var(--muted)}.fld .u{font-size:11px;opacity:.8}
.fld input[type=number],.fld input[type=text],.fld select{display:block;margin-top:4px;width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.fld input[type=range]{display:block;width:100%;margin-top:6px;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--fg);padding:4px 0}.chk input{accent-color:var(--accent);width:16px;height:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g2 .wide{grid-column:1/-1}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stack{display:grid;gap:12px}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.sect{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.lbdrop{border:1.5px dashed var(--line);border-radius:10px;padding:18px 12px;text-align:center;cursor:pointer;display:grid;place-items:center;gap:10px;background:var(--bg)}
.lbdrop.over{border-color:var(--accent)}.lbdrop-in{display:grid;gap:3px;justify-items:center}
.lbdrop-ic svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;opacity:.6}
.lbthumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.lbthumb{position:relative;display:block}
.lbthumb button.add{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#fff repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/14px 14px;aspect-ratio:1}
.lbthumb img{width:100%;height:100%;object-fit:contain;border-radius:8px;display:block}
.lbrm{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;line-height:1;font-size:15px}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fonts button{font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:7px;padding:8px 6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fonts button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.fonts button small{display:block;font:500 10.5px/1.2 "IBM Plex Sans",system-ui,sans-serif;color:var(--muted);margin-top:2px}
.presets{display:grid;gap:8px}
.presets button{font-family:"Archivo Black",system-ui,sans-serif;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:10px 12px;cursor:pointer}
.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shapes button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:10px 4px 8px;cursor:pointer;display:grid;justify-items:center;gap:6px;font:500 11.5px/1.2 "IBM Plex Sans",system-ui,sans-serif}
.shapes svg{width:34px;height:34px;fill:var(--fg);opacity:.85}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.2);cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.swatches button.orig{background:conic-gradient(#c8202c,#f2c21b,#2e9a4c,#1f5fbf,#6b3fa0,#c8202c)}
.layers{display:grid;gap:6px}
.layer{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 4px 4px 10px}
.layer[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.layer .nm{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--fg);font:inherit;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px;padding:5px 0}
.layer .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.layer .nm i{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.2);background-size:cover;background-position:center}
.layer .btn{padding:4px 6px}
.rowb{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.rowb .btn{flex:1}
.tog{width:100%;justify-content:flex-start}.tog[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.tog .dot{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;display:inline-block;flex:none}
.tog[aria-pressed="true"] .dot{background:currentColor;box-shadow:inset 0 0 0 3px var(--card)}
.holes{display:grid;gap:6px;margin-top:8px}
.hole{display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:4px 4px 4px 10px;background:var(--bg)}.hole span{flex:1}
.shapes button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.shapes.sm{grid-template-columns:repeat(6,1fr);gap:6px}.shapes.sm button{padding:7px 2px}.shapes.sm svg{width:20px;height:20px}
.hole[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hole input{width:54px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:13px}
.lit3d .seg{background:var(--card);border:1px solid var(--line)}.lit3d .seg button[aria-pressed="true"]{background:var(--raise)}
.ed-top .btn svg.i{width:18px;height:18px}
.ed-stage{grid-row:2;grid-column:3;position:relative;background:var(--stage);display:flex;flex-direction:column;min-width:0;min-height:0}
.stage-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px}
.stage-bar .seg{background:var(--card);border:1px solid var(--line)}.stage-bar .seg button[aria-pressed="true"]{background:var(--raise)}
.hist{position:absolute;left:12px;top:10px;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:2px}
.chip{font-size:12px;font-weight:600;letter-spacing:.02em;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.stage-c{flex:1;min-height:0;position:relative}
#mkPrevChip{position:absolute;left:12px;top:4px;z-index:1;pointer-events:none}
#mkStage,#mk3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#mkStage.grab{cursor:grab}
.lit3d{position:absolute;right:12px;top:4px;z-index:1}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.empty>div{pointer-events:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 26px;display:grid;gap:12px;max-width:340px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.empty p{margin:0;font-weight:600}.empty .rowb{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px;margin:0}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.inks{display:grid;gap:6px}
.ink{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.ink>button{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--fg);font:inherit;font-size:13px;padding:7px 10px;cursor:pointer;text-align:left}
.ink>button i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.2);flex:none}.ink>button span{flex:1}.ink>button small{color:var(--muted)}
.ink .swatches{padding:2px 10px 10px}
.pcheck{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pcheck li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:13px;line-height:1.4}
.pcheck svg{width:16px;height:16px;margin-top:1px;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pcheck .ok svg{stroke:var(--ok)}.pcheck .warn svg{stroke:var(--warn)}.pcheck .info svg{stroke:var(--muted)}
.pcheck .warn{color:var(--fg);font-weight:500}
.elprops{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:18px;background:var(--bg)}
.elprops h2{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.dl{display:grid;gap:8px;margin-top:16px}#lbDl{display:grid;gap:6px}
.lbstat{margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(10,14,24,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal>div{background:var(--card);border:1px solid var(--line);border-radius:14px;width:min(760px,100%);max-height:86dvh;overflow:auto;padding:18px}
.modal h2{margin:0 0 14px;font-size:16px;display:flex;align-items:center;justify-content:space-between}
.drafts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.draft{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);display:grid}
.draft button.open{border:0;padding:0;background:#1a1c20;cursor:pointer;aspect-ratio:4/3}.draft img{width:100%;height:100%;object-fit:cover;display:block}
.draft .meta{padding:8px 10px;display:flex;align-items:center;gap:6px}.draft .meta div{flex:1;min-width:0}.draft b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.draft small{color:var(--muted);font-size:11.5px}
.draft.new button.open{white-space:normal;padding:12px;background:var(--raise);color:var(--fg);font:600 14px "IBM Plex Sans",system-ui,sans-serif}
.toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:grid;gap:6px;z-index:30}
.toast{background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px}
@media (max-width:1180px){.ed{grid-template-columns:72px 260px minmax(0,1fr) 272px}}
@media (max-width:860px){
  .ed{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .ed-top{padding:8px 12px;gap:8px}.ed-brand{display:none}.ed-top .grow{display:none}.ed-top .seg{flex:1}.ed-top .seg button{flex:1;padding:6px 6px}
  .ed-top #mkTopDl{display:none}.ed-top #mkDrafts span{display:none}
  .ed-stage{grid-row:2;grid-column:1}
  .ed-rail{grid-row:3;grid-column:1;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom));overflow:visible}
  .ed-rail button{flex:1;padding:7px 0;font-size:10.5px;min-width:0}.ed-rail .r-print{display:grid}.ed-rail button svg{width:20px;height:20px}
  .ed-drawer,.ed-props{position:fixed;left:0;right:0;bottom:var(--barh,62px);max-height:58dvh;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);z-index:5;padding-top:14px}
  .ed:not([data-sheet="tool"]) .ed-drawer{display:none}.ed:not([data-sheet="print"]) .ed-props{display:none}
  .sheet-x{display:inline-flex;float:right;margin:-4px -4px 0 0}
  .stage-bar{padding:8px 10px;justify-content:flex-end}.hist{top:8px}
  .elprops [data-op=done]{display:none}.lit3d{top:auto;bottom:12px;right:50%;transform:translateX(50%)}.lit3d .seg button{padding:6px 9px}
}
</style>

<script>
/* ================= MAKER: Light box · Keychain · Sign · Lithophane — pictures, text and shapes in, Bambu-ready 3MF/STL out =================
   Layout: tools on the left, design preview in the middle, the selected layer and print settings on the right; a bottom bar on phones. */
const MK_MODES=[["lightbox","Light box","Pictures, text and shapes glowing in a box. The lights glue inside through the back cover."],["keychain","Keychain","Picture or text traced into a flat multi-colour tag with a ring hole."],["sign","Sign","Raised lettering on a plate. Name plates, badges, shelf signs."],["litho","Lithophane","Photo as a thin plate that shows the picture when lit from behind."]];
const MK_SHAPES=[["trace","Trace the design"],["rect","Rectangle"],["round","Rounded"],["circle","Circle / oval"],["hex","Hexagon"],["heart","Heart"]];
const MK_ELSHAPES=[["rect","Square"],["round","Rounded"],["circle","Circle"],["hex","Hexagon"],["star","Star"],["heart","Heart"]];
/* print-friendly fonts: bold enough to hold up at 0.4 mm; [family, label, weight] */
const MK_FONTS=[["Archivo Black","Heavy sans",400],["Inter","Clean sans",800],["Montserrat","Geometric",800],["Bebas Neue","Tall caps",400],["Oswald","Condensed",700],["Roboto Slab","Slab serif",700],["Playfair Display","Serif",800],["Great Vibes","Script",400]];
/* filament colours */
const MK_INKS=[["Black","#1d1d1f"],["White","#f4f3ef"],["Red","#c8202c"],["Orange","#e8731e"],["Yellow","#f2c21b"],["Green","#2e9a4c"],["Teal","#0e7c74"],["Blue","#1f5fbf"],["Navy","#1b2a4a"],["Purple","#6b3fa0"],["Pink","#e46aa2"],["Grey","#8a8d91"]];
/* printers: [id, label, bed x, bed y] */

function mkPath(ctx,kind,w,h,rf){ const a=w/2,b=h/2; ctx.beginPath();

function mkFlush(){ if(mkHistPending) mkCommitNow(); }

      const key=((k*(R+1)+r)*(C+1)+c)*3+sub; let v=vmap.get(key); if(v===undefined){ v=V.length/3; const e=sub?0.03:0; /* pinch copies sit a hair apart, inside their own cell */ V.push(X(c+(xc+0.5-c)*e),H-(r+(xr+0.5-r)*e)*res,lv[k]); vmap.set(key,v); } return v; };
  const inR=(c,r,q)=>{ for(const [x,y] of [[c-1,r-1],[c,r-1],[c-1,r],[c,r]]) if(x>=q[0]&&x<q[2]&&y>=q[1]&&y<q[3]) return [x,y]; return [c,r]; };
  const rv=(c,r,k,q)=>{ const x=inR(c,r,q); return vx(c,r,k,x[0],x[1]); };
  const tri=(a,b,c,nx,ny,nz)=>{ const ax=V[a*3],ay=V[a*3+1],az=V[a*3+2]; const ux=V[b*3]-ax,uy=V[b*3+1]-ay,uz=V[b*3+2]-az,wx=V[c*3]-ax,wy=V[c*3+1]-ay,wz=V[c*3+2]-az; const cx=uy*wz-uz*wy,cy=uz*wx-ux*wz,cz=ux*wy-uy*wx; const fx=mirror?-nx:nx, fy=-ny; if(cx*fx+cy*fy+cz*nz<0) T.push(a,c,b); else T.push(a,b,c); };
  const face=(m,k,dir)=>{ for(const q of mkRects(m,C,R)){ const [c0,r0,c1,r1]=q; const ring=[]; for(let c=c0;c<c1;c++) ring.push(rv(c,r0,k,q)); for(let r=r0;r<r1;r++) ring.push(rv(c1,r,k,q)); for(let c=c1;c>c0;c--) ring.push(rv(c,r1,k,q)); for(let r=r1;r>r0;r--) ring.push(rv(c0,r,k,q));
    const ci=V.length/3; V.push(X((c0+c1)/2),H-(r0+r1)/2*res,lv[k]); for(let j=0;j<ring.length;j++) tri(ci,ring[j],ring[(j+1)%ring.length],0,0,dir); } };
  for(let k=1;k<lv.length;k++){ const m=new Uint8Array(C*R); for(let i=0;i<C*R;i++) m[i]=hm[i]===lv[k]?1:0; face(m,k,1); }
  { const m=new Uint8Array(C*R); for(let i=0;i<C*R;i++) m[i]=hm[i]>0?1:0; face(m,0,-1); }
  const nb=[[-1,0],[1,0],[0,-1],[0,1]];
  for(let r=0;r<R;r++) for(let c=0;c<C;c++){ const h=hm[r*C+c]; if(!(h>0)) continue;
    for(const [dc,dr] of nb){ const nc=c+dc, nr=r+dr; const hn=(nc<0||nr<0||nc>=C||nr>=R)?0:hm[nr*C+nc]; if(hn>=h) continue; const lo=li.get(hn>0?hn:z0), hi=li.get(h);
      const p=dc===-1?[c,r]:dc===1?[c+1,r]:dr===-1?[c,r]:[c,r+1], q=dc===-1?[c,r+1]:dc===1?[c+1,r+1]:dr===-1?[c+1,r]:[c+1,r+1];
      for(let k=lo;k<hi;k++){ const a=vx(p[0],p[1],k,c,r), b=vx(q[0],q[1],k,c,r), cc=vx(q[0],q[1],k+1,c,r), d=vx(p[0],p[1],k+1,c,r); tri(a,b,cc,dc,dr,0); tri(a,cc,d,dc,dr,0); } } }
  return {verts:V,tris:T}; }
/* every edge used by exactly two triangles = sealed */
function mkSealed(mesh){ const n=mesh.verts.length/3, cnt=new Map(); const T=mesh.tris; for(let i=0;i<T.length;i+=3) for(let k=0;k<3;k++){ const a=T[i+k], b=T[i+(k+1)%3]; const key=a<b?a*n+b:b*n+a; cnt.set(key,(cnt.get(key)||0)+1); } for(const v of cnt.values()) if(v!==2) return false; return T.length>0; }
function mkTriArray(mesh){ const o=new Float32Array(mesh.tris.length*3); for(let i=0;i<mesh.tris.length;i++){ const v=mesh.tris[i]*3; o[i*3]=mesh.verts[v]; o[i*3+1]=mesh.verts[v+1]; o[i*3+2]=mesh.verts[v+2]; } return o; }
function lbSTL(tri,name){ const n=tri.length/9; const buf=new ArrayBuffer(84+n*50); const dv=new DataView(buf); const hdr=("Charleston 3D maker "+(name||"")).slice(0,79); for(let i=0;i<hdr.length;i++) dv.setUint8(i,hdr.charCodeAt(i)&127); dv.setUint32(80,n,true); let o=84;
  for(let t=0;t<n;t++){ const i=t*9; const ux=tri[i+3]-tri[i],uy=tri[i+4]-tri[i+1],uz=tri[i+5]-tri[i+2],vx=tri[i+6]-tri[i],vy=tri[i+7]-tri[i+1],vz=tri[i+8]-tri[i+2]; const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx; const l=Math.hypot(nx,ny,nz)||1; dv.setFloat32(o,nx/l,true); dv.setFloat32(o+4,ny/l,true); dv.setFloat32(o+8,nz/l,true); o+=12; for(let k=0;k<9;k++){ dv.setFloat32(o,tri[i+k],true); o+=4; } dv.setUint16(o,0,true); o+=2; }
  return new Blob([buf],{type:"model/stl"}); }
/* ---- 3MF (zip, stored) with one object per part, named by colour ---- */
const MK_CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function mkCrc(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=MK_CRC[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function mkZip(files){ const enc=new TextEncoder(); const parts=[], cd=[]; let off=0; const le16=v=>[v&255,(v>>8)&255], le32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  for(const f of files){ const name=enc.encode(f.name), data=typeof f.data==="string"?enc.encode(f.data):f.data; const crc=mkCrc(data); const hdr=new Uint8Array([0x50,0x4b,3,4,...le16(20),...le16(0),...le16(0),...le16(0),...le16(0),...le32(crc),...le32(data.length),...le32(data.length),...le16(name.length),...le16(0),...name]); parts.push(hdr,data);
    cd.push(new Uint8Array([0x50,0x4b,1,2,...le16(20),...le16(20),...le16(0),...le16(0),...le16(0),...le16(0),...le32(crc),...le32(data.length),...le32(data.length),...le16(name.length),...le16(0),...le16(0),...le16(0),...le16(0),...le32(0),...le32(off),...name])); off+=hdr.length+data.length; }
  const cdLen=cd.reduce((s,a)=>s+a.length,0); const end=new Uint8Array([0x50,0x4b,5,6,...le16(0),...le16(0),...le16(files.length),...le16(files.length),...le32(cdLen),...le32(off),...le16(0)]); return new Blob([...parts,...cd,end],{type:"model/3mf"}); }
function mk3MF(meshes,title){ const esc1=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); let objs="", items="";
  meshes.forEach((m,i)=>{ const id=i+1; const v=[]; for(let k=0;k<m.verts.length;k+=3) v.push(`<vertex x="${m.verts[k].toFixed(3)}" y="${m.verts[k+1].toFixed(3)}" z="${m.verts[k+2].toFixed(3)}"/>`); const t=[]; for(let k=0;k<m.tris.length;k+=3) t.push(`<triangle v1="${m.tris[k]}" v2="${m.tris[k+1]}" v3="${m.tris[k+2]}"/>`);
    objs+=`<object id="${id}" name="${esc1(m.name)}" type="model"><mesh><vertices>${v.join("")}</vertices><triangles>${t.join("")}</triangles></mesh></object>`; items+=`<item objectid="${id}"/>`; });
  const model=`<?xml version="1.0" encoding="UTF-8"?><model unit="millimeter" xml:lang="en-US" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02"><metadata name="Title">${esc1(title)}</metadata><metadata name="Application">Charleston 3D Maker</metadata><resources>${objs}</resources><build>${items}</build></model>`;
  return mkZip([{name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/></Types>`},{name:"_rels/.rels",data:`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>`},{name:"3D/3dmodel.model",data:model}]); }
function lbSlug(s){ return String(s||"maker").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48)||"maker"; }

function mkMesh(part,L){ const hm=new Float32Array(L.cols*L.rows); for(let i=0;i<hm.length;i++) if(part.mask[i]) hm[i]=part.z1; const f=mkField(hm,L.cols,L.rows,L.res,part.z0,!!part.mirror); return {verts:f.verts,tris:f.tris,name:part.name,color:part.color}; }
/* all the given parts as one sealed solid (for a one-colour STL): each column runs from 0 to its highest part */
function mkUnion(parts,L){ const hm=new Float32Array(L.cols*L.rows); for(const p of parts) for(let i=0;i<hm.length;i++) if(p.mask[i]&&p.z1>hm[i]) hm[i]=p.z1; const f=mkField(hm,L.cols,L.rows,L.res,0,!!(parts[0]&&parts[0].mirror)); return f; }
/* stand: a cradle the box's bottom edge sits in, standing up. Channel 0.6 mm wider than the box is deep */
function mkStandMesh(L){ const res=0.5, Wg=L.cols*L.res; const len=Math.min(160,Math.max(40,Wg*0.6)); const deep=MK.depth+(MK.lid?MK.lidT:0); const wS=deep+0.6+10;
  const C=Math.round(len/res), R=Math.round(wS/res), s0=Math.round(5/res); const hm=new Float32Array(C*R); for(let r=0;r<R;r++) for(let c=0;c<C;c++) hm[r*C+c]=(r>=s0&&r<R-s0)?4:12;
  const f=mkField(hm,C,R,res,0,false); return {verts:f.verts,tris:f.tris,name:"Stand",color:mkRgb(MK.frameInk),len:C*res,wS:R*res,deep}; }
async function lbBuild(){ if(MK.busy) return; if(MK.mode!=="sign"&&!MK.els.some(mkElOk)){ toast("Add a picture, some text or a shape first."); if(mkPhone()) mkTool("picture",true); return; }
  clearTimeout(lbPrevTimer); lbPreviewNow();
  MK.busy=true; const m=MK.node, st=m.querySelector("#lbStat"), btns=[m.querySelector("#lbBuild"),m.querySelector("#mkTopDl")]; btns.forEach(b=>b.disabled=true); st.textContent="Building the print files…"; await new Promise(r=>setTimeout(r,30));
  try{ const name=MK.name||mkTitle(); const slug=lbSlug(name); const parts=[]; MK.meta={}; let sealed={ok:true,n:0,bad:0,mode:MK.mode};
    if(MK.mode==="litho"){ const src=mkSource(); const {w,h}=lbDims(src); const cell=MK.lres; const cols=Math.round(w/cell)+1, rows=Math.round(h/cell)+1; const T=lbThick(lbGrey(src,cols,rows)); let tri=lbGridSolid(cols,rows,cell,(c,r)=>T[(rows-1-r)*cols+c]); if(MK.arc>0) tri=lbBend(tri,(cols-1)*cell,MK.arc); tri=lbStandUp(tri); parts.push({name:slug+"-lithophane.stl",blob:lbSTL(tri,name),label:"Lithophane STL"}); sealed.n=1; MK.meta={w,h}; }
    else { const L=mkLayout(); if(!L) throw new Error("no source"); const fp=L.parts.filter(p=>!p.lid), lp=L.parts.filter(p=>p.lid); const front=fp.map(p=>mkMesh(p,L)), lid=lp.map(p=>mkMesh(p,L));
      const one=mkUnion(fp,L), oneLid=lp.length?mkUnion(lp,L):null, stand=MK.mode==="lightbox"&&MK.stand?mkStandMesh(L):null;
      for(const x of [...front,...lid,one,...(oneLid?[oneLid]:[]),...(stand?[stand]:[])]){ if(!mkSealed(x)){ sealed.ok=false; sealed.bad++; } } sealed.n=front.length+lid.length+(stand?1:0);
      parts.push({name:slug+".3mf",blob:mk3MF(front,name),label:"3MF for Bambu Studio (multi-colour)"}); if(lid.length) parts.push({name:slug+"-back-cover.3mf",blob:mk3MF(lid,name+" back cover"),label:"Back cover 3MF"});
      parts.push({name:slug+"-one-colour.stl",blob:lbSTL(mkTriArray(one),name),label:"One-colour STL"}); if(oneLid) parts.push({name:slug+"-back-cover.stl",blob:lbSTL(mkTriArray(oneLid),name+" back cover"),label:"Back cover STL"});
      if(stand) parts.push({name:slug+"-stand.stl",blob:lbSTL(mkTriArray(stand),name+" stand"),label:"Stand STL"});
      MK.meta={w:mkRound(L.cols*L.res),h:mkRound(L.rows*L.res),palette:L.palette.map(mkHex),parts:L.parts.length}; }
    MK.parts=parts; MK.dirty=false; MK.sealed=sealed; const tot=parts.reduce((s,p)=>s+p.blob.size,0);
    const ck=m.querySelector("#mkCheck"); if(MK.L&&ck) ck.innerHTML=mkChecks(MK.L).map(([k,t])=>`<li class="${k}">${ICON[k]}<span>${esc(t)}</span></li>`).join("");
    st.textContent=MK.mode==="litho"?`Ready · ${(tot/1048576).toFixed(1)} MB · Bambu Studio: white PLA, 0.12 mm layers, 100% infill, print standing.`:`Ready · ${(tot/1048576).toFixed(1)} MB · Open the 3MF in Bambu Studio, say Yes to "load as one object with multiple parts", then pick a filament for each part (names show the colour).`;
    const dl=m.querySelector("#lbDl"); dl.innerHTML=`<button type="button" class="btn block" data-lbdlall>Download all again (.zip)</button>`+parts.map((p,i)=>`<button type="button" class="btn sm block" data-lbdl="${i}">${esc(p.label||p.name)} only</button>`).join("");
    dl.querySelector("[data-lbdlall]").onclick=()=>lbDownloadZip(MK.parts,slug+"-print-files.zip");
    dl.querySelectorAll("[data-lbdl]").forEach(b=>b.onclick=()=>lbDownloadZip([MK.parts[+b.dataset.lbdl]],MK.parts[+b.dataset.lbdl].name.replace(/\.\w+$/,"")+".zip"));
    await lbDownloadZip(parts,slug+"-print-files.zip");
  }catch(e){ console.error("maker build",e); st.textContent="Couldn't build that: "+String(e&&e.message||e).slice(0,120)+". Try a smaller size or less detail."; }
  MK.busy=false; btns.forEach(b=>b.disabled=false); }
async function lbDownloadZip(list,zipName){ try{ const files=[]; for(const p of list) files.push({name:p.name,data:new Uint8Array(await p.blob.arrayBuffer())});
  files.push({name:"HOW TO PRINT.txt",data:MK.mode==="litho"?"Open the .stl in Bambu Studio. White PLA, 0.12 mm layers, 100% infill, print standing up.\r\n":"Open the .3mf in Bambu Studio and say Yes to 'load as one object with multiple parts'. Pick a filament for each part; part names show the colour. Prints face down (colours first).\r\n"+(MK.mode==="lightbox"?"Print the back cover on its own, flat side down. Glue the lights to the inside through the back, then press the cover in.\r\n"+(MK.stand?"Print the stand on its own, open side up, and stand the box in it.\r\n":""):"")});
  const z=mkZip(files); await lbDownload({name:zipName,blob:new Blob([z],{type:"application/zip"})}); }catch(e){ console.error("maker zip",e); toast("Couldn't package the files. Try again."); } }
async function lbDownload(p){ if(!p||!p.blob) return; return dlBlob(p.name,p.blob); }
/* ---- saved designs: kept in this browser as you work (up to 20) ---- */
const MK_DKEY="c3d-maker-drafts-v1";
function mkDraftsLoad(){ try{ const v=JSON.parse(localStorage.getItem(MK_DKEY)||"[]"); return Array.isArray(v)?v:[]; }catch{ return []; } }
function mkDraftsSave(list){ try{ localStorage.setItem(MK_DKEY,JSON.stringify(list)); return true; }catch{ return false; } }
let mkAutoT=null, mkSpaceWarned=false;
function mkAutosave(){ clearTimeout(mkAutoT); mkAutoT=setTimeout(mkSaveDraftNow,1200); }
function mkSaveDraftNow(){ clearTimeout(mkAutoT); if(!MK.node) return; if(!(MK.mode==="sign"?!!(MK.text||"").trim():MK.els.length>0)) return; if(!MK.draftId) MK.draftId=mkId("d");
  const pics={}; for(const e of MK.els) if(e.type==="image"&&!pics[e.pic]){ const p=MK.pics.get(e.pic); if(p) pics[e.pic]=p.data; }
  let thumb=""; try{ const cv=MK.node.querySelector("#mkStage"); const t=document.createElement("canvas"); t.width=320; t.height=Math.max(1,Math.round(cv.height*320/cv.width)); t.getContext("2d").drawImage(cv,0,0,t.width,t.height); thumb=t.toDataURL("image/jpeg",0.72); }catch{}
  const d={id:MK.draftId,name:MK.name||mkTitle(),mode:MK.mode,at:Date.now(),state:mkSnap(),pics,thumb};
  const list=[d,...mkDraftsLoad().filter(x=>x&&x.id!==d.id)].slice(0,20); if(!mkDraftsSave(list)&&!mkSpaceWarned){ mkSpaceWarned=true; toast("This browser is out of room for saved designs. Delete an old one in My designs."); } }
async function mkOpenDraft(d){ for(const [id,data] of Object.entries(d.pics||{})){ const have=MK.pics.get(id); if(have&&!have.gone) continue; try{ MK.pics.set(id,mkPrepPic(await mkLoadImg(data),id)); }catch{} }
  try{ mkApply(d.state); }catch{ toast("That saved design couldn't be opened."); return; } MK.draftId=d.id; MK.hist=[]; MK.fut=[]; MK.sel=null; MK.selHole=null; mkRemount(); }
function mkNewDesign(){ mkSaveDraftNow(); const mode=MK.mode; mkApply(MK_DEF); MK.mode=mode; MK.els=[]; MK.draftId=null; MK.hist=[]; MK.fut=[]; MK.sel=null; MK.selHole=null; mkRemount(); }
function mkDraftsUI(){ mkSaveDraftNow(); const list=mkDraftsLoad(); const modes=Object.fromEntries(MK_MODES.map(x=>[x[0],x[1]]));
  const wrap=document.createElement("div"); wrap.className="modal"; wrap.setAttribute("role","dialog"); wrap.setAttribute("aria-modal","true"); wrap.setAttribute("aria-label","My designs");
  wrap.innerHTML=`<div><h2>My designs<button type="button" class="btn ghost icon" data-x aria-label="Close">${mkIc("x")}</button></h2><p class="hint" style="margin:-6px 0 14px">Designs save in this browser as you work.</p>
    <div class="drafts"><div class="draft new"><button type="button" class="open" data-new>Start a new design</button></div>${list.map(d=>`<div class="draft" data-id="${esc(d.id)}"><button type="button" class="open" data-open aria-label="Open ${esc(d.name)}">${d.thumb?`<img src="${esc(d.thumb)}" alt="">`:""}</button><div class="meta"><div><b>${esc(d.name)}</b><small>${esc(modes[d.mode]||"")} · ${esc(new Date(d.at).toLocaleDateString(undefined,{month:"short",day:"numeric"}))}</small></div><button type="button" class="btn ghost icon" data-del title="Delete" aria-label="Delete ${esc(d.name)}">${mkIc("trash",16)}</button></div></div>`).join("")}</div></div>`;
  const close=()=>{ wrap.remove(); document.removeEventListener("keydown",esc1); }; const esc1=e=>{ if(e.key==="Escape") close(); };
  wrap.onclick=e=>{ if(e.target===wrap||e.target.closest("[data-x]")) return close(); if(e.target.closest("[data-new]")){ close(); mkNewDesign(); return; }
    const row=e.target.closest("[data-id]"); if(!row) return; const d=mkDraftsLoad().find(x=>x.id===row.dataset.id); if(!d) return;
    if(e.target.closest("[data-del]")){ mkDraftsSave(mkDraftsLoad().filter(x=>x.id!==d.id)); if(MK.draftId===d.id) MK.draftId=null; row.remove(); return; }
    if(e.target.closest("[data-open]")){ close(); mkOpenDraft(d); } };
  document.addEventListener("keydown",esc1); document.body.appendChild(wrap); const f=wrap.querySelector("[data-new]"); if(f) f.focus(); }

const MK_DEF=mkSnap();
lbMount();
</script>
