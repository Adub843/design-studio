<style>
/* light, neutral editor: white bars and panels, grey canvas, near-black buttons. Dark only when the console's theme asks for it. */
:root{--bg:#f5f5f5;--card:#fff;--raise:#f2f2f3;--line:#e4e4e6;--line2:#cfcfd3;--fg:#1a1a1a;--muted:#6e6e73;--accent:#1a1a1a;--accent-fg:#fff;--sel:#3d6be0;--stage:#ececec;--bed:#b3b3b6;--field:#f4f4f5;--warn:#a35a00;--ok:#2d7a46;color-scheme:light}
:root[data-theme="dark"]{--bg:#161617;--card:#1e1e20;--raise:#29292c;--line:#323235;--line2:#48484c;--fg:#ececec;--muted:#a1a1a6;--accent:#f0f0f0;--accent-fg:#141414;--sel:#7d9cf0;--stage:#2a2a2d;--bed:#5c5c60;--field:#2a2a2d;--warn:#f0b44c;--ok:#6cc58b;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:13.5px/1.45 "Inter","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
[hidden]{display:none!important}.small{font-size:12.5px}.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{font:inherit;font-weight:500;font-size:13.5px;border-radius:6px;border:1px solid var(--line2);background:var(--card);color:var(--fg);padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--raise)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}.btn.primary:hover{opacity:.88;background:var(--accent)}.btn:disabled{opacity:.4;cursor:default}
.btn.block{width:100%}.btn.sm{padding:5px 10px;font-size:12.5px}.btn.ghost{background:none;border-color:transparent}.btn.ghost:hover{background:var(--raise)}.btn.ghost:disabled:hover{background:none}
.btn.icon{padding:6px}.btn.icon.sm{padding:4px}
#lbMount{flex:1;min-height:0;display:flex}
.ed{flex:1;min-width:0;min-height:0;display:grid;grid-template-columns:56px minmax(0,1fr) 296px;grid-template-rows:48px minmax(0,1fr);position:relative}
/* top bar */
.ed-top{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:0 12px 0 8px;background:var(--card);border-bottom:1px solid var(--line);min-width:0}
.tb-l{display:flex;align-items:center;gap:2px;min-width:0}.tb-r{display:flex;align-items:center;gap:8px;justify-self:end}
.pname{display:inline-flex;align-items:center;gap:4px;min-width:0;color:var(--muted);cursor:text}
#lbName{font:inherit;font-weight:600;font-size:15px;color:var(--fg);border:1px solid transparent;background:none;border-radius:5px;padding:4px 6px;min-width:40px;max-width:280px;field-sizing:content;text-overflow:ellipsis}
#lbName::placeholder{color:var(--fg);opacity:1}#lbName:hover{border-color:var(--line)}#lbName:focus{outline:none;border-color:var(--line2);background:var(--field)}
.modemenu{position:relative;margin-left:8px}.modemenu>.btn{color:var(--muted);border-color:var(--line);padding:4px 8px 4px 10px;font-size:12.5px}
.menu{position:absolute;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:4px;display:grid;min-width:180px}
.menu button{font:inherit;font-size:13px;text-align:left;border:0;background:none;color:var(--fg);padding:7px 10px;border-radius:5px;cursor:pointer;white-space:nowrap}
.menu button:hover,.menu button[aria-current="true"],.menu button[aria-checked="true"]{background:var(--raise)}
.menu button b{font-weight:600}.menu button small{display:block;color:var(--muted);font-size:11.5px;white-space:normal}
.menu button.danger{color:#b42318}
#mkModes{top:calc(100% + 6px);left:0;width:290px}
.menu.float{position:fixed;z-index:60;min-width:160px}
.seg{display:inline-flex;background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{font:inherit;font-size:13px;font-weight:500;border:0;background:none;color:var(--muted);padding:5px 22px;border-radius:5px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
/* tool rail */
.ed-rail{grid-row:2;grid-column:1;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:8px 4px;overflow:auto}
.ed-rail button{font:inherit;font-size:11.5px;border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:3px;padding:8px 0 7px;border-radius:7px;cursor:pointer}
.ed-rail button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ed-rail button:hover,.ed-rail button[aria-pressed="true"]{color:var(--fg);background:var(--raise)}
.ed-rail .r-settings{display:none}
/* pop-overs next to the rail */
.pop{position:absolute;left:62px;top:56px;width:290px;max-height:calc(100% - 70px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:8}
.pop-h,.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 8px 9px 14px;border-bottom:1px solid var(--line)}
.pop-h h2,.ph h2{font-size:14px;font-weight:600;margin:0}
.pop section{padding:12px 14px 14px}
.lbdrop{border:1px dashed var(--line2);border-radius:8px;padding:20px 12px;text-align:center;cursor:pointer;display:grid;place-items:center;gap:8px;background:var(--field)}
.lbdrop:hover,.lbdrop.over{border-color:var(--fg)}.lbdrop-in{display:grid;gap:2px;justify-items:center}
.lbdrop-ic svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.6}
.lbthumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.lbthumbs:empty{display:none}.lbthumb{position:relative;display:block}
.lbthumb button.add{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:#fff repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/12px 12px;aspect-ratio:1}
.lbthumb img{width:100%;height:100%;object-fit:contain;border-radius:6px;display:block}
.lbrm{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--fg);cursor:pointer;line-height:1;font-size:14px;padding:0}
.adj{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.adj summary{cursor:pointer;font-size:12.5px;color:var(--muted)}.adj .stack{margin-top:10px}
.adj input[type=range]{width:100%;accent-color:var(--accent)}
.shrow{display:flex;gap:2px;justify-content:space-between}
.shrow button{border:1px solid transparent;background:none;color:var(--fg);border-radius:6px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;padding:0}
.shrow button:hover{background:var(--raise);border-color:var(--line)}
.shrow svg,.tiles svg{width:22px;height:22px}
.layers{display:grid;gap:2px}
.layer{display:flex;align-items:center;gap:4px;border-radius:6px;padding:1px 2px 1px 6px;border:1px solid transparent;cursor:grab}
.layer:hover{background:var(--raise)}.layer[aria-current="true"]{background:var(--raise);border-color:var(--line)}.layer.over{border-color:var(--sel)}.layer.dragging{opacity:.45}
.layer .nm{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--fg);font:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 0}
.layer .nm svg{color:var(--muted);width:15px;height:15px}.layer .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* canvas */
.ed-stage{grid-row:2;grid-column:2;position:relative;background:var(--stage);display:flex;min-width:0;min-height:0}
.stage-c{flex:1;min-height:0;min-width:0;position:relative;overflow:hidden}
.stage-c[data-dp="preview"]{background:linear-gradient(180deg,#262628 0%,#2e2e30 42%,#45454a 100%)}
#mkStage,#mk3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#mkStage.grab{cursor:grab}#mkStage.panning{cursor:grabbing}
.bedchip{position:absolute;transform:translate(-100%,calc(-100% - 3px));display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:2px 3px 2px 9px;font-size:12px;color:var(--muted);white-space:nowrap;z-index:3}
.bedchip b{color:var(--fg);font-weight:600}
.bedchip>button{border:0;border-left:1px solid var(--line);background:none;color:var(--muted);padding:3px 4px 3px 7px;cursor:pointer;display:grid}.bedchip>button:hover{color:var(--fg)}
.bedmenu{top:calc(100% + 4px);right:0}.bedmenu span{color:var(--muted)}
.tbar{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.05);z-index:3}
.tbar .btn{padding:6px;color:var(--fg)}.tbar .btn[aria-pressed="true"]{background:var(--raise)}.tbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.ed[data-dp="preview"] .tbar{background:#38383b;border-color:#48484c;box-shadow:none}.ed[data-dp="preview"] .tbar .btn{color:#e4e4e6}.ed[data-dp="preview"] .tbar .btn:hover{background:#48484c}
.framepill{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px 8px 12px;font-size:13px;z-index:3;cursor:pointer;user-select:none}
.framepill .s{display:none}
.sw{appearance:none;-webkit-appearance:none;width:30px;height:18px;border-radius:9px;background:var(--line2);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw:checked{background:var(--accent)}.sw:checked::after{left:14px}
:root[data-theme="dark"] .sw:checked::after{background:#141414}
.chip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:11.5px;font-weight:500;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid var(--line);color:var(--muted);white-space:nowrap;pointer-events:none;z-index:1}
.stage-c[data-dp="preview"] .chip{background:rgba(0,0,0,.3);border-color:rgba(255,255,255,.1);color:#c9c9cc}
.pvbar{position:absolute;left:14px;top:14px;display:flex;gap:10px;align-items:center;z-index:3}
.seg.dk{background:#38383b;border-color:#48484c}.seg.dk button{color:#d0d0d4;padding:6px 14px}.seg.dk button[aria-pressed="true"]{background:#5a5a5e;color:#fff;box-shadow:none}
.ltog{display:flex;align-items:center;gap:6px;background:#38383b;border:1px solid #48484c;border-radius:7px;padding:6px 8px;color:#a8a8ad;cursor:pointer}
.ltog .knob{width:26px;height:14px;border-radius:7px;background:#5a5a5e;position:relative}.ltog .knob::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#cfcfd3;transition:left .15s}
.ltog[aria-pressed="true"]{color:#f3d58a}.ltog[aria-pressed="true"] .knob{background:#c99a32}.ltog[aria-pressed="true"] .knob::after{left:14px;background:#fff}
.plates{position:absolute;left:14px;top:58px;width:262px;background:#2a2a2c;border:1px solid #3c3c40;border-radius:8px;padding:6px;display:grid;gap:4px;z-index:3}
.plates button{display:flex;align-items:center;gap:12px;border:0;background:none;color:#e8e8ea;font:inherit;font-size:13px;font-weight:600;padding:6px;border-radius:6px;cursor:pointer;text-align:left}
.plates button[aria-pressed="true"],.plates button:hover{background:#3b3b3e}.plates img{width:56px;height:56px;border-radius:4px;flex:none}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;z-index:2}
.empty>div{pointer-events:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 24px;display:grid;gap:12px;max-width:340px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.empty p{margin:0;font-weight:600}.empty .rowb{margin:0}
/* right panel: Overall settings in sections, or the selected element */
.ed-props{grid-row:2;grid-column:3;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ph{border-bottom:0;padding:12px 10px 8px 14px}
.ovl{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;padding:2px 4px;border-radius:4px;margin-left:auto}.ovl:hover{color:var(--fg)}.ovl svg{width:14px;height:14px}
.pb{flex:1;overflow:auto;padding:0 12px 20px}
.sheet-x{display:none}
.acc{border:1px solid transparent;border-radius:6px;margin-bottom:8px;background:var(--raise)}
.acc.open{background:var(--card);border-color:var(--line)}
.acc>.ah{width:100%;display:flex;align-items:center;justify-content:space-between;border:0;background:none;color:var(--fg);font:inherit;font-size:13.5px;font-weight:500;padding:10px 12px;cursor:pointer;text-align:left}
.acc>.ah svg{transition:transform .15s;color:var(--muted)}.acc.open>.ah svg{transform:rotate(180deg)}
.acc .ab{display:none;padding:2px 12px 14px;border-top:1px solid var(--line)}.acc.open .ab{display:block}
.k{font-size:12.5px;color:var(--muted);margin:12px 0 6px}
.pl{font-size:13px;margin:12px 0 6px}.plate{background:var(--raise);border-radius:4px;padding:1px 10px 10px}
.pk{font-size:12.5px;margin:9px 0 6px}
.dots{display:flex;flex-wrap:wrap;gap:8px;min-height:20px}
.cdot{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.22);padding:0;cursor:pointer;flex:none}
.cdot[aria-expanded="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--fg)}.cdot.fixed,.cdot:disabled{cursor:default}
.inkpick{margin-top:10px;padding:2px 10px 10px;border:1px solid var(--line);border-radius:6px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.2);cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--fg)}
.swatches button.orig{background:conic-gradient(#c8202c,#f2c21b,#2e9a4c,#1f5fbf,#6b3fa0,#c8202c)}
.segw{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:2px;gap:2px}
.segw button{font:inherit;font-size:12.5px;border:0;background:none;color:var(--muted);padding:6px 4px;border-radius:4px;cursor:pointer}
.segw button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1);font-weight:500}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tiles button{width:38px;height:38px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;display:grid;place-items:center;cursor:pointer;padding:0}
.tiles button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg);background:var(--raise)}
.tiles.lbl{flex-wrap:nowrap}.tiles.lbl button{width:auto;height:auto;flex:1;padding:8px 4px 6px;gap:3px;font:inherit;font-size:12px}
.sl{margin-top:12px}.sl>label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.slr{display:grid;grid-template-columns:minmax(0,1fr) 86px;gap:10px;align-items:center}
.slr input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.num{display:flex;align-items:center;border:1px solid var(--line);border-radius:5px;background:var(--field);padding-right:7px}
.num input{width:100%;min-width:0;border:0;background:none;color:var(--fg);font:inherit;font-size:13px;padding:5px 2px 5px 8px;font-variant-numeric:tabular-nums}.num input:focus{outline:none}.num:focus-within{border-color:var(--line2)}
.num i{font-style:normal;font-size:11.5px;color:var(--muted)}
.fld{display:block;font-size:12.5px;color:var(--muted)}.fld .u{font-size:11px;opacity:.8}
.fld input[type=number],.fld input[type=text],.fld select,.ed-props select,.ed-props textarea{display:block;margin-top:4px;width:100%;padding:6px 9px;border-radius:5px;border:1px solid var(--line);background:var(--field);color:var(--fg);font:inherit;font-size:13.5px}
.ed-props textarea{resize:vertical;min-height:38px;margin-top:0}
.ed-props .stack>select{margin-top:0}
.fld.in{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:5px;background:var(--field);padding:0 8px}
.fld.in b{font-weight:500;font-size:12px}.fld.in input{border:0!important;background:none!important;margin:0!important;padding:6px 0!important;min-width:0}.fld.in i{font-style:normal;font-size:11.5px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg);padding:5px 0}.chk input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .wide{grid-column:1/-1}
.stack{display:grid;gap:10px}
.hint{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.45}
.algn{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;justify-self:start}.algn button{border:0;background:var(--card);color:var(--muted);padding:6px 10px;cursor:pointer;display:grid}.algn button+button{border-left:1px solid var(--line)}.algn button[aria-pressed="true"]{background:var(--raise);color:var(--fg)}
.colrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:5px;background:var(--field);padding:5px 8px}.colrow .cdot{cursor:default;border-radius:3px;width:18px;height:18px}
.hex{border:0;background:none;color:var(--fg);font:inherit;font-size:13px;width:100%;text-transform:uppercase}.hex:focus{outline:none}
.colrow+.swatches{margin-top:8px}
.swrow{display:flex;align-items:center;justify-content:space-between;margin-top:6px}.swrow .k{margin:0;color:var(--fg);font-weight:500}
.holes{display:grid;gap:4px;margin-top:10px}.holes:empty{display:none}
.hole{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:2px 2px 2px 8px}
.hole[aria-current="true"]{border-color:var(--fg)}
.hole .nm{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--fg);font:inherit;font-size:12.5px;padding:5px 0;cursor:pointer;text-align:left;min-width:0}.hole .nm svg{width:18px;height:18px;flex:none}.hole small{color:var(--muted);margin-left:auto;padding-right:4px;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;margin:10px 0 12px}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.pcheck{list-style:none;margin:0;padding:0;display:grid;gap:8px}

    const ck=m.querySelector("#mkCheck"); if(MK.L&&ck) ck.innerHTML=mkChecks(MK.L).map(([k,t])=>`<li class="${k}">${ICON[k]}<span>${esc(t)}</span></li>`).join("");
    st.textContent=MK.mode==="litho"?`Ready · ${(tot/1048576).toFixed(1)} MB · Bambu Studio: white PLA, 0.12 mm layers, 100% infill, print standing.`:`Ready · ${(tot/1048576).toFixed(1)} MB · Open the 3MF in Bambu Studio: ${plates.length>1?`${plates.length} plates, `:""}one part per colour (the part names show the colour). Pick a filament for each part.`;
    const dl=m.querySelector("#lbDl"); dl.innerHTML=`<button type="button" class="btn sm block" data-lbdlall>Download all again (.zip)</button>`+parts.map((p,i)=>`<button type="button" class="btn sm block" data-lbdl="${i}">${esc(p.label||p.name)} only</button>`).join("");
    dl.querySelector("[data-lbdlall]").onclick=()=>lbDownloadZip(MK.parts,slug+"-print-files.zip");
    dl.querySelectorAll("[data-lbdl]").forEach(b=>b.onclick=()=>lbDownloadZip([MK.parts[+b.dataset.lbdl]],MK.parts[+b.dataset.lbdl].name.replace(/\.\w+$/,"")+".zip"));
    if(opts.collect){ MK.busy=false; btn.disabled=false; btn.textContent="Export"; st.textContent=""; return parts; } await lbDownloadZip(parts,slug+"-print-files.zip"); toast("Print files downloaded.");
  }catch(e){ console.error("maker build",e); if(opts.collect){ MK.busy=false; btn.disabled=false; btn.textContent="Export"; throw e; } st.textContent="Couldn't build that: "+String(e&&e.message||e).slice(0,120)+". Try a smaller size or less detail."; toast("Couldn't build the print files. See Print check."); }
  MK.busy=false; btn.disabled=false; btn.textContent="Export"; }
async function lbDownloadZip(list,zipName){ try{ const files=[]; for(const p of list) files.push({name:p.name,data:new Uint8Array(await p.blob.arrayBuffer())});
  const made=`Made for the ${mkPrinterName()} with a ${MK.nozzle} mm nozzle.\r\n`;
  files.push({name:"HOW TO PRINT.txt",data:made+(MK.mode==="litho"?"Open the .stl in Bambu Studio. White PLA, 0.12 mm layers, 100% infill, print standing up.\r\n":"Open the .3mf in Bambu Studio. Each plate holds one object with one part per colour; the part names show the colour. Pick a filament for each part. The front prints face down (colours first).\r\n"+(MK.mode==="lightbox"?"Plate 2 is the back cover: it prints flat side down. Glue the lights to the inside through the back, then press the cover in.\r\n"+(MK.stand?"The base prints on plate 2 next to the back cover, open side up. Stand the box in it.\r\n":""):"")+"The STL files are the same parts in one colour, if you'd rather paint or use one filament.\r\n")});
  const z=mkZip(files); await lbDownload({name:zipName,blob:new Blob([z],{type:"application/zip"})}); }catch(e){ console.error("maker zip",e); toast("Couldn't package the files. Try again."); } }
async function lbDownload(p){ if(!p||!p.blob) return; return dlBlob(p.name,p.blob); }
/* ---- My designs: kept in this browser as you work (up to 30) ---- */
const MK_DKEY="c3d-maker-drafts-v1", MK_DMAX=30;
function mkDraftsLoad(){ try{ const v=JSON.parse(localStorage.getItem(MK_DKEY)||"[]"); return Array.isArray(v)?v:[]; }catch{ return []; } }
function mkDraftsSave(list){ try{ localStorage.setItem(MK_DKEY,JSON.stringify(list)); return true; }catch{ return false; } }
let mkAutoT=null, mkSpaceWarned=false;
function mkAutosave(){ clearTimeout(mkAutoT); mkAutoT=setTimeout(mkSaveDraftNow,1200); }
function mkThumb(){ try{ const L=MK.L; const t=document.createElement("canvas"); t.width=320; t.height=240; const x=t.getContext("2d"); x.fillStyle="#efefef"; x.fillRect(0,0,320,240);
    const img=L&&!L.litho?mkFaceCells(L,false).face:(mkSource()||{}).img; if(img){ const sc=Math.min(250/img.width,180/img.height), w=Math.max(1,img.width*sc), h=Math.max(1,img.height*sc); x.drawImage(mkUp(img,w,h),(320-w)/2,(240-h)/2); }
    return t.toDataURL("image/jpeg",0.78); }catch{ return ""; } }
function mkSaveDraftNow(){ clearTimeout(mkAutoT); if(!MK.node) return; if(!mkHasContent()) return; if(!MK.draftId) MK.draftId=mkId("d");
  const pics={}; for(const e of MK.els) if(e.type==="image"&&!pics[e.pic]){ const p=MK.pics.get(e.pic); if(p) pics[e.pic]=p.data; }
  const d={id:MK.draftId,name:MK.name||mkDefName(),mode:MK.mode,at:Date.now(),state:mkSnap(),pics,thumb:mkThumb()};
  const list=[d,...mkDraftsLoad().filter(x=>x&&x.id!==d.id)].slice(0,MK_DMAX); if(!mkDraftsSave(list)&&!mkSpaceWarned){ mkSpaceWarned=true; toast("This browser is out of room for saved designs. Delete an old one in My designs."); } }
async function mkOpenDraft(d){ for(const [id,data] of Object.entries(d.pics||{})){ const have=MK.pics.get(id); if(have&&!have.gone) continue; try{ MK.pics.set(id,mkPrepPic(await mkLoadImg(data),id)); }catch{} }
  try{ mkApply(MK_DEF); mkApply(d.state); }catch{ toast("That saved design couldn't be opened."); return; } if(MK_SOLO) MK.mode="lightbox";
  MK.draftId=d.id; MK.hist=[]; MK.fut=[]; MK.sel=null; MK.selHole=null; MK.dp="design"; MK.zoom=1; MK.pan=[0,0]; MK.pop=null; mkRemount(); }
function mkNewDesign(){ mkSaveDraftNow(); const mode=MK.mode; mkApply(MK_DEF); MK.mode=mode; MK.els=[]; MK.draftId=null; MK.hist=[]; MK.fut=[]; MK.sel=null; MK.selHole=null; MK.dp="design"; MK.zoom=1; MK.pan=[0,0]; MK.pop=null; mkRemount(); }
function mkWhen(t){ const d=new Date(t), p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function mkDraftsUI(){ mkSaveDraftNow(); const list=mkDraftsLoad(); const modes=Object.fromEntries(MK_MODES.map(x=>[x[0],x[1]]));
  const w=mkDlg("mkDraftsDlg",`My designs <span class="muted" id="mkDraftN">(${list.length} / ${MK_DMAX})</span>`,`<p class="hint" style="margin:-4px 0 14px">Designs save in this browser as you work.</p><div class="drafts">
    <button type="button" class="draft new" data-new>${mkIc("plus",36)}<span>New project</span></button>
    ${list.map(d=>`<div class="draft" data-id="${esc(d.id)}"><button type="button" class="open" data-open aria-label="Open ${esc(d.name)}">${d.thumb?`<img src="${esc(d.thumb)}" alt="">`:""}</button><button type="button" class="btn icon sm more" data-menu title="More" aria-label="More for ${esc(d.name)}" aria-haspopup="true">${mkIc("more",16)}</button><div class="meta"><b>${esc(d.name)}</b><small>${MK_SOLO?"":esc(modes[d.mode]||"")+" · "}Last updated ${esc(mkWhen(d.at))}</small></div></div>`).join("")}</div>`,"",true);
  w.querySelector(".drafts").onclick=e=>{ if(e.target.closest("[data-new]")){ w.close(); mkNewDesign(); return; } const row=e.target.closest("[data-id]"); if(!row) return; const id=row.dataset.id; const d=mkDraftsLoad().find(x=>x.id===id); if(!d) return;
    const mb=e.target.closest("[data-menu]"); if(mb){ mkMenu(mb,[["rename","Rename"],["dup","Duplicate"],["del","Delete",1]],op=>mkDraftOp(op,id,row,w)); return; }
    if(e.target.closest("[data-open]")||e.target.closest(".meta")){ w.close(); mkOpenDraft(d); } };
  const f=w.querySelector("[data-new]"); if(f) f.focus(); }
function mkDraftOp(op,id,row,w){ const list=mkDraftsLoad(); const d=list.find(x=>x.id===id); if(!d) return;
  if(op==="del"){ const rest=list.filter(x=>x.id!==id); mkDraftsSave(rest); if(MK.draftId===id) MK.draftId=null; row.remove(); const n=w.querySelector("#mkDraftN"); if(n) n.textContent=`(${rest.length} / ${MK_DMAX})`; return; }
  if(op==="dup"){ if(list.length>=MK_DMAX){ toast(`You can keep ${MK_DMAX} designs. Delete one first.`); return; } mkDraftsSave([Object.assign({},d,{id:mkId("d"),name:(d.name+" copy").slice(0,80),at:Date.now()}),...list]); w.close(); mkDraftsUI(); return; }
  if(op==="rename"){ const b=row.querySelector(".meta b"); if(!b) return; const inp=document.createElement("input"); inp.type="text"; inp.value=d.name; inp.maxLength=80; inp.className="rn"; inp.setAttribute("aria-label","Design name"); b.replaceWith(inp); inp.focus(); inp.select(); let done=false;
    const fin=save=>{ if(done) return; done=true; const v=inp.value.trim(); let nm=d.name; if(save&&v){ nm=v; const l=mkDraftsLoad(); const x=l.find(y=>y.id===id); if(x){ x.name=v; mkDraftsSave(l); } if(MK.draftId===id){ MK.name=v; const n=MK.node.querySelector("#lbName"); if(n) n.value=v; } } const nb=document.createElement("b"); nb.textContent=nm; if(inp.isConnected) inp.replaceWith(nb); };
    inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); fin(true); } else if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); fin(false); } }; inp.onblur=()=>fin(true); inp.onclick=e=>e.stopPropagation(); } }

const MK_DEF=mkSnap();
lbMount();
/* EPIX3D: what the site bridge (/assets/epix-bridge.js) needs from this maker */
{ const setMode0=mkSetMode; mkSetMode=function(md){ setMode0(md); if(window.EPIX) window.EPIX.refreshTitle(); }; }
window.EPIX_MAKER={
  id:"lightbox",
  title:()=>mkTitle()+" maker",
  mode:()=>MK.mode,
  name:()=>MK.name||mkDefName(),
  hasContent:()=>mkHasContent(),
  getState(){ mkFlush(); const pics={}; for(const e of MK.els) if(e.type==="image"&&!pics[e.pic]){ const p=MK.pics.get(e.pic); if(p) pics[e.pic]=p.data; } return {v:1,mode:MK.mode,name:MK.name,state:mkSnap(),pics}; },
  async setState(d){ if(!d||!d.state) throw new Error("no design"); await mkOpenDraft({id:mkId("d"),name:d.name,mode:d.mode,state:d.state,pics:d.pics||{}}); if(window.EPIX) window.EPIX.refreshTitle(); },
  thumb:()=>mkThumb(),
  async buildPrintFile(){ const parts=await lbBuild({collect:true}); if(!parts||!parts.length) throw new Error("The print file couldn't be built."); const f=parts.find(p=>/\.3mf$/.test(p.name))||parts[0]; const m=MK.meta||{};
    const size=m.w&&m.h?`${m.w} x ${m.h} mm`:""; const cols=(m.palette||[]).map(h=>mkInkName(String(h).toLowerCase())).join(", ");
    return {blob:f.blob,name:f.name,details:[mkTitle(),size,cols?"colours: "+cols:"",MK.mode==="lightbox"&&MK.stand?"with stand":""].filter(Boolean).join(", ")}; },
  downloadSelector:"#mkExport, [data-lbdl], [data-lbdlall]",
};
</script>
<script src="/assets/epix-bridge.js"></script>
</body>
