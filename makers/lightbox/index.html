<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Light Box Maker · Charleston 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@800&family=Archivo+Black&family=Bebas+Neue&family=Oswald:wght@700&family=Montserrat:wght@800&family=Roboto+Slab:wght@700&family=Playfair+Display:wght@800&family=Great+Vibes&display=swap">
<script>try{var t=parent.document.documentElement.dataset.theme||localStorage.getItem("bc-theme");if(t)document.documentElement.dataset.theme=String(t).replace(/"/g,"")}catch(e){}</script>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--raise:#ece5d6;--line:#ddd3bf;--fg:#16203a;--muted:#5e6474;--accent:#0e7c74;--accent-fg:#fff;--stage:#e7e1d4;--warn:#9a5b00;--ok:#0e7c74;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1428;--card:#111d36;--raise:#182644;--line:#24345a;--fg:#f3ede1;--muted:#aab3c7;--accent:#4fc8bd;--accent-fg:#06201d;--stage:#0d1830;--warn:#f0b44c;--ok:#4fc8bd;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1428;--card:#111d36;--raise:#182644;--line:#24345a;--fg:#f3ede1;--muted:#aab3c7;--accent:#4fc8bd;--accent-fg:#06201d;--stage:#0d1830;--warn:#f0b44c;--ok:#4fc8bd;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
[hidden]{display:none!important}.small{font-size:12.5px}.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--muted)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}.btn.sm{padding:6px 10px;font-size:13px}
#lbMount{flex:1;min-height:0;display:flex}
.ed{flex:1;min-width:0;min-height:0;display:grid;grid-template-columns:76px 292px minmax(0,1fr) 304px;grid-template-rows:56px minmax(0,1fr)}
.ed-top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);min-width:0}
.ed-brand{font-weight:600;font-size:15px;white-space:nowrap}.ed-brand span{color:var(--muted);font-weight:500}
.seg{display:inline-flex;background:var(--raise);border-radius:9px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.seg button{font:inherit;font-size:13.5px;font-weight:500;border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ed-top .grow{flex:1}
.ed-rail{grid-row:2;grid-column:1;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:8px 6px}
.ed-rail button{font:inherit;font-size:11.5px;font-weight:500;border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:4px;padding:10px 2px;border-radius:9px;cursor:pointer}
.ed-rail button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ed-rail button:hover{color:var(--fg)}.ed-rail button[aria-pressed="true"]{background:var(--raise);color:var(--accent)}
.ed-rail .r-print{display:none}
.ed-drawer{grid-row:2;grid-column:2;background:var(--card);border-right:1px solid var(--line);overflow:auto;padding:18px 16px 24px}
.ed-props{grid-row:2;grid-column:4;background:var(--card);border-left:1px solid var(--line);overflow:auto;padding:18px 16px 24px}
.ed-drawer h2,.ed-props h2{font-size:15px;margin:0 0 14px;font-weight:600}
.ed-props h3,.ed-drawer h3{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px;font-weight:600}
.sheet-x{display:none}
.fld{display:block;font-size:12.5px;color:var(--muted)}.fld .u{font-size:11px;opacity:.8}
.fld input[type=number],.fld input[type=text],.fld select{display:block;margin-top:4px;width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.fld input[type=range]{display:block;width:100%;margin-top:6px;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--fg);padding:4px 0}.chk input{accent-color:var(--accent);width:16px;height:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g2 .wide{grid-column:1/-1}
.stack{display:grid;gap:12px}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.lbdrop{border:1.5px dashed var(--line);border-radius:10px;padding:18px 12px;text-align:center;cursor:pointer;display:grid;place-items:center;gap:10px;background:var(--bg)}
.lbdrop.over{border-color:var(--accent)}.lbdrop-in{display:grid;gap:3px;justify-items:center}
.lbdrop-ic svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;opacity:.6}
.lbthumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.lbthumb{position:relative;display:inline-block}
.lbthumb img{width:84px;height:84px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:#fff repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/14px 14px}
.lbrm{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;line-height:1;font-size:15px}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fonts button{font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:7px;padding:8px 6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fonts button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.fonts button small{display:block;font:500 10.5px/1.2 "IBM Plex Sans",system-ui,sans-serif;color:var(--muted);margin-top:2px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.2);cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.layers{display:grid;gap:6px;margin-top:12px}
.layers button{font:inherit;text-align:left;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 10px;cursor:pointer}
.layers button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.layers i{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.2)}.layers span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tedit{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.rowb{display:flex;gap:8px;margin-top:12px}.rowb .btn{flex:1}
.tog{width:100%;justify-content:flex-start}.tog[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.tog .dot{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;display:inline-block;flex:none}
.tog[aria-pressed="true"] .dot{background:currentColor;box-shadow:inset 0 0 0 3px var(--card)}
.ed-stage{grid-row:2;grid-column:3;position:relative;background:var(--stage);display:flex;flex-direction:column;min-width:0;min-height:0}
.stage-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px}
#mkPrevChip{position:absolute;left:12px;top:4px;z-index:1;pointer-events:none}
.chip{font-size:12px;font-weight:600;letter-spacing:.02em;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.stage-bar .seg{background:var(--card);border:1px solid var(--line)}.stage-bar .seg button[aria-pressed="true"]{background:var(--raise)}
.stage-c{flex:1;min-height:0;position:relative}
#mkStage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#mkStage.grab{cursor:grab}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.empty>div{pointer-events:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 26px;display:grid;gap:12px;max-width:320px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.empty p{margin:0;font-weight:600}.empty .rowb{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.lbpal{display:flex;flex-wrap:wrap;gap:6px}
.lbpal .sw{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 9px 3px 4px;border-radius:999px;border:1px solid var(--line)}
.lbpal .sw i{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.2)}
.pcheck{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pcheck li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:13px;line-height:1.4}
.pcheck svg{width:16px;height:16px;margin-top:1px;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pcheck .ok svg{stroke:var(--ok)}.pcheck .warn svg{stroke:var(--warn)}.pcheck .info svg{stroke:var(--muted)}
.pcheck .warn{color:var(--fg);font-weight:500}
.dl{display:grid;gap:8px;margin-top:16px}#lbDl{display:grid;gap:6px}
.lbstat{margin-top:10px}
.toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:grid;gap:6px;z-index:9}
.toast{background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px}
@media (max-width:1180px){.ed{grid-template-columns:72px 260px minmax(0,1fr) 272px}}
@media (max-width:860px){
  .ed{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .ed-top{padding:8px 12px;gap:10px;flex-wrap:wrap}.ed-brand{display:none}.ed-top .grow{display:none}.ed-top .seg{flex:1}.ed-top .seg button{flex:1;padding:6px 8px}
  .ed-top #mkTopDl{display:none}
  .ed-stage{grid-row:2;grid-column:1}
  .ed-rail{grid-row:3;grid-column:1;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .ed-rail button{flex:1;padding:7px 2px}.ed-rail .r-print{display:grid}
  .ed-drawer,.ed-props{position:fixed;left:0;right:0;bottom:var(--barh,62px);max-height:58dvh;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);z-index:5;padding-top:14px}
  .ed:not([data-sheet="tool"]) .ed-drawer{display:none}.ed:not([data-sheet="print"]) .ed-props{display:none}
  .sheet-x{display:inline-flex;float:right;margin:-4px -4px 0 0}
  .stage-bar{padding:8px 10px}
}
</style>
</head>
<body>
<!-- Copy of tools/maker/index.html from Adub843/Business-console, plus the back bar. Change it there first, then copy it here. -->
<div id="ds-back-bar" style="position:sticky;top:0;z-index:2147483000;display:flex;align-items:center;gap:12px;height:40px;flex:none;padding:0 16px;background:#15223f;color:#f7f2e8;font:500 14px/1 Inter,system-ui,sans-serif"><a href="/#makers" style="color:#f7f2e8;text-decoration:none;display:inline-flex;align-items:center;gap:6px"><span aria-hidden="true">&#8592;</span> Back to Design Studio</a><span style="opacity:.6;margin-left:auto">Light Box Maker</span></div>
<div id="lbMount"></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SV=p=>`<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const ICON={image:SV('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>'),text:SV('<path d="M5 6V4h14v2M12 4v16M9 20h6"/>'),size:SV('<path d="M4 9V4h5M20 15v5h-5M4 4l7 7M20 20l-7-7"/>'),box:SV('<path d="M12 3 4 7v10l8 4 8-4V7z"/><path d="m4 7 8 4 8-4M12 11v10"/>'),print:SV('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),ok:SV('<path d="M20 6 9 17l-5-5"/>'),warn:SV('<path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/>'),info:SV('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'),x:SV('<path d="M6 6l12 12M18 6 6 18"/>')};
function toast(msg){let box=document.getElementById("toasts");if(!box){box=document.createElement("div");box.id="toasts";box.className="toasts";box.setAttribute("role","status");document.body.appendChild(box);}const t=document.createElement("div");t.className="toast";t.textContent=msg;box.appendChild(t);setTimeout(()=>t.remove(),3500);}
function dlBlob(name,blob){name=String(name||"file").replace(/[\\/:*?"<>|]+/g,"-");const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);return true;}
</script>
<script>
/* ================= MAKER: Light box · Keychain · Sign · Lithophane — picture or text in, Bambu-ready 3MF/STL out =================
   Layout: tools on the left, design preview in the middle, print settings and download on the right; a bottom bar on phones. */
const MK_MODES=[["lightbox","Light box","Picture or text glowing in a box. The lights glue inside through the back cover."],["keychain","Keychain","Picture or text traced into a flat multi-colour tag with a ring hole."],["sign","Sign","Raised lettering on a plate. Name plates, badges, shelf signs."],["litho","Lithophane","Photo as a thin plate that shows the picture when lit from behind."]];
const MK_SHAPES=[["trace","Trace the picture"],["rect","Square / rectangle"],["round","Rounded"],["circle","Circle"]];
/* print-friendly fonts: bold enough to hold up at 0.4 mm; [family, label, weight] */
const MK_FONTS=[["Archivo Black","Heavy sans",400],["Inter","Clean sans",800],["Montserrat","Geometric",800],["Bebas Neue","Tall caps",400],["Oswald","Condensed",700],["Roboto Slab","Slab serif",700],["Playfair Display","Serif",800],["Great Vibes","Script",400]];
/* filament colours */
const MK_INKS=[["Black","#1d1d1f"],["White","#f4f3ef"],["Red","#c8202c"],["Orange","#e8731e"],["Yellow","#f2c21b"],["Green","#2e9a4c"],["Teal","#0e7c74"],["Blue","#1f5fbf"],["Navy","#1b2a4a"],["Purple","#6b3fa0"],["Pink","#e46aa2"],["Grey","#8a8d91"]];
const MK_BED=256, MK_HOLE=15;
const MK={mode:"lightbox", imgs:[], texts:[], sel:null, tool:"picture", sheet:null, view:{lightbox:"lit",keychain:"front",sign:"front",litho:"lit"},
  shape:"trace", width:120, height:0, lock:true, res:0.4, colors:4, border:4, gap:0, depth:50, wallT:3, lid:true, hole:false, imgT:0.6, backT:1.0, keyT:3, ring:true, text:"", font:"Archivo Black", textT:1, plateT:3, name:"",
  minT:0.8, maxT:3.0, lres:0.3, arc:0, invert:false, bright:0, contrast:0, blur:0.6, mirror:false,
  busy:false, parts:[], palette:[], node:null, dirty:true, keyTol:40, bg:"auto", L:null, sealed:null, fontGen:0};
const LB=MK; /* legacy alias */
let mkTextId=0;

function mkRound(n,d){ return Math.round(n*(d||10))/(d||10); }
function mkTitle(){ return ({lightbox:"Light box",keychain:"Keychain",sign:"Sign",litho:"Lithophane"})[MK.mode]||"Maker"; }
function mkFontW(f){ const x=MK_FONTS.find(a=>a[0]===f); return x?x[2]:700; }
function mkFontReady(f){ if(!document.fonts||!document.fonts.load) return; document.fonts.load(`${mkFontW(f)} 80px "${f}"`).then(()=>{ MK.fontGen++; MK.comp=null; lbPreview(); }).catch(()=>{}); }
function mkFontGrid(id,cur){ return `<div class="fonts" id="${id}">${MK_FONTS.map(f=>`<button type="button" data-font="${esc(f[0])}" aria-pressed="${cur===f[0]}" style="font-family:'${esc(f[0])}';font-weight:${f[2]}">${esc(f[0])}<small>${esc(f[1])}</small></button>`).join("")}</div>`; }
/* ---- page ---- */
function lbMount(){ const m=document.getElementById("lbMount"); if(!m) return; MK.node=m;
  try{ const q=new URLSearchParams(location.search).get("mode"); if(MK_MODES.some(x=>x[0]===q)) MK.mode=q; }catch{}
  const tools=[["picture","Picture",ICON.image],["text","Text",ICON.text],["size","Size",ICON.size],["build","Box",ICON.box],["print","Print",ICON.print]];
  m.innerHTML=`<div class="ed" id="mkEd">
    <header class="ed-top">
      <div class="ed-brand">Maker <span>· Charleston 3D</span></div>
      <div class="seg" id="mkModes" role="group" aria-label="What to make">${MK_MODES.map(x=>`<button type="button" data-mode="${x[0]}" title="${esc(x[2])}" aria-pressed="${MK.mode===x[0]}">${x[1]}</button>`).join("")}</div>
      <div class="grow"></div>
      <button type="button" class="btn primary" id="mkTopDl">${ICON.print.replace("<svg",'<svg width="18" height="18" style="stroke:currentColor;fill:none;stroke-width:1.8"')}Download print files</button>
    </header>
    <nav class="ed-rail" id="mkRail" aria-label="Tools">${tools.map(t=>`<button type="button" data-tool="${t[0]}" class="r-${t[0]}" aria-pressed="false">${t[2]}<span>${t[1]}</span></button>`).join("")}</nav>
    <aside class="ed-drawer" id="mkDrawer" aria-label="Tool settings">
      <button type="button" class="btn sm sheet-x" data-close aria-label="Close">${ICON.x.replace("<svg",'<svg width="16" height="16" style="stroke:currentColor;fill:none;stroke-width:2"')}</button>
      <section data-panel="picture">
        <h2>Picture</h2>
        <div class="lbdrop" id="lbDrop" tabindex="0" role="button" aria-label="Drop a picture here or tap to choose">
          <input type="file" id="lbFile" accept="image/*" multiple hidden>
          <div class="lbdrop-in"><span class="lbdrop-ic">${ICON.image}</span><strong>Upload a picture</strong><span class="small muted">Drop it here, tap to choose, or paste</span></div>
          <div class="lbthumbs" id="lbThumbs"></div></div>
        <p class="hint">A PNG with a see-through background traces cleanest. With a photo, the plain background around the subject is removed.</p>
        <div class="stack" style="margin-top:14px">
          <label class="fld">Brightness<input type="range" id="lbBright" min="-60" max="60" step="5" value="${MK.bright}"></label>
          <label class="fld">Contrast<input type="range" id="lbContrast" min="-60" max="60" step="5" value="${MK.contrast}"></label>
          <label class="fld mk-litho">Smooth<input type="range" id="lbBlur" min="0" max="2" step="0.2" value="${MK.blur}"></label>
          <label class="chk mk-litho"><input type="checkbox" id="lbInvert" ${MK.invert?"checked":""}> Negative</label>
        </div>
      </section>
      <section data-panel="text">
        <h2>Text</h2>
        <div class="mk-sign stack">
          <label class="fld">Sign text<input type="text" id="mkText" maxlength="40" placeholder="e.g. THE LEWIS FAMILY" value="${esc(MK.text)}"></label>
          <div><h3 style="margin-top:4px">Font</h3>${mkFontGrid("mkFont",MK.font)}</div>
        </div>
        <div class="mk-notsign">
          <button type="button" class="btn primary block" id="mkAddText">Add text</button>
          <div class="layers" id="mkLayers"></div>
          <div class="tedit" id="mkTextEd" hidden></div>
        </div>
      </section>
      <section data-panel="size">
        <h2>Size &amp; shape</h2>
        <div class="g2">
          <label class="fld wide mk-shape">Outline<select id="mkShape">${MK_SHAPES.map(s=>`<option value="${s[0]}" ${MK.shape===s[0]?"selected":""}>${s[1]}</option>`).join("")}</select></label>
          <label class="fld">Width <span class="u">mm</span><input type="number" id="lbW" min="20" max="240" step="1" value="${MK.width}"></label>
          <label class="fld mk-notsign">Height <span class="u">mm</span><input type="number" id="lbH" min="20" max="240" step="1" value="${MK.height||""}" placeholder="auto"></label>
          <label class="chk wide mk-notsign"><input type="checkbox" id="lbLock" ${MK.lock?"checked":""}> Keep picture shape</label>

function mkMesh(part,L){ const hm=new Float32Array(L.cols*L.rows); for(let i=0;i<hm.length;i++) if(part.mask[i]) hm[i]=part.z1; const f=mkField(hm,L.cols,L.rows,L.res,part.z0,!!part.mirror); return {verts:f.verts,tris:f.tris,name:part.name,color:part.color}; }
/* all the given parts as one sealed solid (for a one-colour STL): each column runs from 0 to its highest part */
function mkUnion(parts,L){ const hm=new Float32Array(L.cols*L.rows); for(const p of parts) for(let i=0;i<hm.length;i++) if(p.mask[i]&&p.z1>hm[i]) hm[i]=p.z1; const f=mkField(hm,L.cols,L.rows,L.res,0,!!(parts[0]&&parts[0].mirror)); return f; }
/* every edge used by exactly two triangles = sealed */
function mkSealed(mesh){ const n=mesh.verts.length/3, cnt=new Map(); const T=mesh.tris; for(let i=0;i<T.length;i+=3) for(let k=0;k<3;k++){ const a=T[i+k], b=T[i+(k+1)%3]; const key=a<b?a*n+b:b*n+a; cnt.set(key,(cnt.get(key)||0)+1); } for(const v of cnt.values()) if(v!==2) return false; return T.length>0; }

function lbSTL(tri,name){ const n=tri.length/9; const buf=new ArrayBuffer(84+n*50); const dv=new DataView(buf); const hdr=("Charleston 3D maker "+(name||"")).slice(0,79); for(let i=0;i<hdr.length;i++) dv.setUint8(i,hdr.charCodeAt(i)&127); dv.setUint32(80,n,true); let o=84;
  for(let t=0;t<n;t++){ const i=t*9; const ux=tri[i+3]-tri[i],uy=tri[i+4]-tri[i+1],uz=tri[i+5]-tri[i+2],vx=tri[i+6]-tri[i],vy=tri[i+7]-tri[i+1],vz=tri[i+8]-tri[i+2]; const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx; const l=Math.hypot(nx,ny,nz)||1; dv.setFloat32(o,nx/l,true); dv.setFloat32(o+4,ny/l,true); dv.setFloat32(o+8,nz/l,true); o+=12; for(let k=0;k<9;k++){ dv.setFloat32(o,tri[i+k],true); o+=4; } dv.setUint16(o,0,true); o+=2; }

/* ---- 3MF (zip, stored) with one object per part, named by colour ---- */
const MK_CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function mkCrc(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=MK_CRC[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function mkZip(files){ const enc=new TextEncoder(); const parts=[], cd=[]; let off=0; const le16=v=>[v&255,(v>>8)&255], le32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  for(const f of files){ const name=enc.encode(f.name), data=typeof f.data==="string"?enc.encode(f.data):f.data; const crc=mkCrc(data); const hdr=new Uint8Array([0x50,0x4b,3,4,...le16(20),...le16(0),...le16(0),...le16(0),...le16(0),...le32(crc),...le32(data.length),...le32(data.length),...le16(name.length),...le16(0),...name]); parts.push(hdr,data);
    cd.push(new Uint8Array([0x50,0x4b,1,2,...le16(20),...le16(20),...le16(0),...le16(0),...le16(0),...le16(0),...le32(crc),...le32(data.length),...le32(data.length),...le16(name.length),...le16(0),...le16(0),...le16(0),...le16(0),...le32(0),...le32(off),...name])); off+=hdr.length+data.length; }

function mk3MF(meshes,title){ const esc1=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); let objs="", items="";
  meshes.forEach((m,i)=>{ const id=i+1; const v=[]; for(let k=0;k<m.verts.length;k+=3) v.push(`<vertex x="${m.verts[k].toFixed(3)}" y="${m.verts[k+1].toFixed(3)}" z="${m.verts[k+2].toFixed(3)}"/>`); const t=[]; for(let k=0;k<m.tris.length;k+=3) t.push(`<triangle v1="${m.tris[k]}" v2="${m.tris[k+1]}" v3="${m.tris[k+2]}"/>`);

  return mkZip([{name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/></Types>`},{name:"_rels/.rels",data:`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>`},{name:"3D/3dmodel.model",data:model}]); }
function lbSlug(s){ return String(s||"maker").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48)||"maker"; }
async function lbBuild(){ if(MK.busy) return; if(MK.mode==="litho"&&!MK.imgs.length&&!MK.texts.length||MK.mode!=="sign"&&MK.mode!=="litho"&&!MK.imgs.length&&!MK.texts.some(t=>(t.text||"").trim())){ toast("Add a picture or some text first."); if(mkPhone()) mkTool("picture",true); return; }
  clearTimeout(lbPrevTimer); lbPreviewNow();
  MK.busy=true; const m=MK.node, st=m.querySelector("#lbStat"), btns=[m.querySelector("#lbBuild"),m.querySelector("#mkTopDl")]; btns.forEach(b=>b.disabled=true); st.textContent="Building the print files…"; await new Promise(r=>setTimeout(r,30));
  try{ const name=MK.name||mkTitle(); const slug=lbSlug(name); const parts=[]; MK.meta={}; let sealed={ok:true,n:0,bad:0,mode:MK.mode};
    if(MK.mode==="litho"){ const src=mkSource(); const {w,h}=lbDims(src); const cell=MK.lres; const cols=Math.round(w/cell)+1, rows=Math.round(h/cell)+1; const T=lbThick(lbGrey(src,cols,rows)); let tri=lbGridSolid(cols,rows,cell,(c,r)=>T[(rows-1-r)*cols+c]); if(MK.arc>0) tri=lbBend(tri,(cols-1)*cell,MK.arc); tri=lbStandUp(tri); parts.push({name:slug+"-lithophane.stl",blob:lbSTL(tri,name),label:"Lithophane STL"}); sealed.n=1; MK.meta={w,h}; }

    const dl=m.querySelector("#lbDl"); dl.innerHTML=`<button type="button" class="btn block" data-lbdlall>Download all again (.zip)</button>`+parts.map((p,i)=>`<button type="button" class="btn sm block" data-lbdl="${i}">${esc(p.label||p.name)} only</button>`).join("");
    dl.querySelector("[data-lbdlall]").onclick=()=>lbDownloadZip(MK.parts,slug+"-print-files.zip");
    dl.querySelectorAll("[data-lbdl]").forEach(b=>b.onclick=()=>lbDownloadZip([MK.parts[+b.dataset.lbdl]],MK.parts[+b.dataset.lbdl].name.replace(/\.\w+$/,"")+".zip"));
    await lbDownloadZip(parts,slug+"-print-files.zip");
  }catch(e){ console.error("maker build",e); st.textContent="Couldn't build that: "+String(e&&e.message||e).slice(0,120)+". Try a smaller size or less detail."; }
  MK.busy=false; btns.forEach(b=>b.disabled=false); }
async function lbDownloadZip(list,zipName){ try{ const files=[]; for(const p of list) files.push({name:p.name,data:new Uint8Array(await p.blob.arrayBuffer())}); files.push({name:"HOW TO PRINT.txt",data:MK.mode==="litho"?"Open the .stl in Bambu Studio. White PLA, 0.12 mm layers, 100% infill, print standing up.\r\n":"Open the .3mf in Bambu Studio and say Yes to 'load as one object with multiple parts'. Pick a filament for each part; part names show the colour. Prints face down (colours first).\r\n"+(MK.mode==="lightbox"?"Print the back cover on its own, flat side down. Glue the lights to the inside through the back, then press the cover in.\r\n":"")});
